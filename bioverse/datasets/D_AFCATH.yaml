description: CATH domain structures from AlphaFold Swiss-Prot for inverse folding
  evaluation, with API fallback for missing entries.
citation:
- Orengo et al. "CATH — A Hierarchic Classification of Protein Domain Structures."
  Structure 5, 1093–1109 (1997).
- Jumper et al. "Highly accurate protein structure prediction with AlphaFold." Nature
  596, 583–589 (2021). https://doi.org/10.1038/s41586-021-03819-2
adapter:
  AlphaFoldInvBenchAdapter:
    af_name: swissprot_pdb
    af_version: v4
    use_api_fallback: true
    api_workers: 64
