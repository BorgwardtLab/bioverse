description: AlphaFold Swiss-Prot structures with Foldseek homology and CATH-domain
  test-set exclusions, length cap, and train/validation/test splits.
citation: Jumper et al. "Highly accurate protein structure prediction with AlphaFold."
  Nature 596, 583–589 (2021). https://doi.org/10.1038/s41586-021-03819-2
adapter:
  AlphaFoldExclusionAdapter:
    name: swissprot_pdb
    version: v4
transforms:
- FilterSequenceLength:
    max_length: 1024
