description: BioLiP protein–small-molecule complexes with experimental Kd affinity
  annotations (full redundant set). Each molecule stores the receptor and ligand as
  separate chains, with residue-level contact labels on the protein.
citation: 'Zhang et al. "BioLiP2: an updated structure database for biologically relevant
  ligand–protein interactions." Nucleic Acids Research 52, D404–D412 (2024).
  https://doi.org/10.1093/nar/gkad630 Yang, Roy, and Zhang. "BioLiP: a semi-manually
  curated database for biologically relevant ligand-protein interactions." Nucleic
  Acids Research 41, D1096–D1103 (2013). https://doi.org/10.1093/nar/gks1173'
adapter: BioLipAdapter
transforms:
- DeduplicateAtoms
- SceneSplit
