description: AlphaFold structures for *E. coli* K-12 with sequence-length filtering
  and fixed train/validation/test splits.
citation: Jumper et al. "Highly accurate protein structure prediction with AlphaFold."
  Nature 596, 583–589 (2021). https://doi.org/10.1038/s41586-021-03819-2
adapter:
  AlphaFoldAdapter:
    name: UP000000625_83333_ECOLI
transforms:
- FilterSequenceLength:
    max_length: 1024
- SceneSplit:
    test_size: 100
    val_size: 100
