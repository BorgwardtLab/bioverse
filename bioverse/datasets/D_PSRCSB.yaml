description: ProteinShake RCSB PDB structures with deduplication and scene splits.
citation: 'Günther et al. "ProteinShake: Building Blocks and Benchmarks for Data-Driven
  Protein Modeling." NeurIPS Datasets and Benchmarks Track (2023).'
adapter:
  ProteinShakeAdapter:
    dataset: RCSBDataset
transforms:
- DeduplicateAtoms
- SceneSplit
