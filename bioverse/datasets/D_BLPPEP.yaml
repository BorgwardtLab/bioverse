description: BioLiP protein–peptide complexes without affinity or contact labels,
  intended for pocket-masked residue prediction. Receptor and peptide are stored as
  separate chains of one molecule. Complexes with any chain of 512 or more
  residues are dropped. The remaining set is randomly split 80/10/10 at the
  scene level.
citation: 'Zhang et al. "BioLiP2: an updated structure database for biologically relevant
  ligand–protein interactions." Nucleic Acids Research 52, D404–D412 (2024).
  https://doi.org/10.1093/nar/gkad630 Yang, Roy, and Zhang. "BioLiP: a semi-manually
  curated database for biologically relevant ligand-protein interactions." Nucleic
  Acids Research 41, D1096–D1103 (2013). https://doi.org/10.1093/nar/gks1173'
adapter:
  BioLipAdapter:
    ligand: peptide
    max_length: 512
transforms:
- DeduplicateAtoms
- FilterSequenceLength:
    max_length: 512
- SceneSplit:
    train_size: 0.8
    test_size: 0.1
    val_size: 0.1
